<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>thesonicmedia</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; display: flex; justify-content: center; min-height: 100vh; }
  .wrap { position: relative; width: 100%; max-width: 608px; margin: 0 auto; display: block; }
  .wrap img { width: 100%; display: block; user-select: none; pointer-events: none; }
  a.hs {
    position: absolute;
    display: block;
    cursor: pointer;
    text-decoration: none;
    border-radius: 18px;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    transition: transform 180ms ease, filter 180ms ease;
  }
  a.hs:hover  { transform: scale(1.04); filter: brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,0.15)); }
  a.hs:active { transform: scale(0.96); filter: brightness(0.9); }
  a.hs.circle { border-radius: 50%; }
</style>
</head>

<div class="wrap">

     href="https://www.thesonicmedia.com" target="_blank" rel="noopener"
     aria-label="Back / Website"
